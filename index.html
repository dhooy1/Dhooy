
<!doctype html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7cb342"/>
    <title>حاسبة التقاعد للعسكريين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        /* نفس CSS اللي ارسلته انت */
        body { background-color: #000; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; color: #fff; text-align: center; }
        form { background: #1c1c1e; border-radius: 12px; padding: 30px; margin: 50px auto; max-width: 600px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: 0.3s; }
        form:hover { transform: translateY(-5px); }
        h4 { font-size: 26px; margin-bottom: 20px; }
        input[type="text"], select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; font-size: 16px; text-align: center; position: relative; height: 50px; }
        input[type="button"], input[type="reset"] { width: 100%; padding: 15px; margin-top: 20px; border-radius: 8px; border: none; font-size: 18px; cursor: pointer; transition: 0.3s; }
        input[type="button"] { background: #7cb342; color: white; } input[type="button"]:hover { background: #66bb6a; }
        input[type="reset"] { background: #42a5f5; color: white; } input[type="reset"]:hover { background: #2196f3; }
        #dhoooy { background: #2c2c2e; border: 1px solid #444; border-radius: 12px; padding: 20px; margin-top: 20px; display: none; }
        #dhoooy p { margin: 10px 0; font-size: 16px; } #dhoooy input { background: #444; border: none; text-align: center; font-size: 16px; color: #fff; }
        img { max-width: 100%; height: auto; margin: 20px 0; border-radius: 12px; transition: 0.3s; } img:hover { transform: scale(1.05); }
        h6 { color: #888; margin-top: 20px; font-size: 14px; }
        .error { color: #ff4d4d; font-size: 14px; }
        .progress-container { position: relative; width: 100%; height: 36px; margin-top: 10px; }
        .progress-bar { position: absolute; top: 0; left: 0; height: 100%; background: red; border-radius: 8px; z-index: 1; width: 0%; }
        input[type="text"].progress-input { background: transparent; border: 1px solid #444; border-radius: 8px; color: #fff; padding: 15px; z-index: 2; position: relative; height: 36px; font-size: 16px; text-align: center; }
        .blink { animation: blink-animation 1s infinite; }
        @keyframes blink-animation { 0% { color: red; } 50% { color: yellow; } 100% { color: red; } }
        .shake { animation: shake-animation 0.5s ease-in-out infinite; }
        @keyframes shake-animation { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>
<form name="form1">
    <h4>حاسبة التقاعد للعسكريين</h4>
    <img src="https://a.top4top.io/p_1544e2e4j0.jpeg" alt="Military Retirement Calculator" />
    <div id="inputFields">
        <input type="text" name="t1" placeholder="ادخل تاريخ ميلادك مثال 1404" />
        <input type="text" name="t2" placeholder="ادخل تاريخ الالتحاق مثال 1404" />
        <input type="text" name="t3" placeholder="آخر مربوط راتب أساسي" />
        <label for="serviceYears">اختر عدد سنوات الخدمة:</label>
        <select id="serviceYears" name="serviceYears">
            <option value="50" />50 سنة - رقيب
            <option value="50" />50 سنة - رقيب أول
            <option value="52" selected />52 سنة - رئيس رقباء
        </select>
    </div>
    <p class="error" id="errorMessage"></p>
    <input type="button" onclick="dagree()" value="احسب" />
    <input type="reset" value="إعادة" onclick="resetForm()" />
    <div id="dhoooy">
        <p>العمر الآن
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <input type="text" id="t5" readonly class="progress-input blink" />
            </div>
        </p>
        <p>عمرك عند دخول الوظيفة <input type="text" name="t10" readonly /></p>
        <p>خدمتك الحالية <input type="text" name="t9" readonly /></p>
        <p>سنوات متبقية <input type="text" name="t7" readonly /></p>
        <p>اجمالي الخدمة عند التقاعد <input type="text" name="t4" readonly /></p>
        <p>عام التقاعد <input type="text" name="t6" readonly /></p>
        <p>راتب التقاعد المبكر <input type="text" name="t20" readonly /></p>
        <p>راتب التقاعد في نهاية الخدمة <input type="text" name="result" readonly /></p>
    </div>
    <h6>١٤٤٦ الشمراني</h6>
</form>
<script>
function dagree() {
    var t1 = form1.t1.value, t2 = form1.t2.value, t3 = form1.t3.value, serviceYears = form1.serviceYears.value;
    if (t1 === "" || t2 === "" || t3 === "") { document.getElementById("errorMessage").innerText = "لا يمكن ترك الحقول فارغة"; return; } 
    else { document.getElementById("errorMessage").innerText = ""; }
    t1 = parseInt(t1); t2 = parseInt(t2); t3 = parseInt(t3); serviceYears = parseInt(serviceYears);
    var t4 = (t1 - t2 + serviceYears); form1.t4.value = t4;
    var result = (t4 * t3 / 35); form1.result.value = Math.round(result);
    var t5 = (1446 - t1); form1.t5.value = t5;
    var t6 = (t1 + serviceYears); form1.t6.value = t6;
    var t7 = (t6 - 1446); form1.t7.value = t7;
    var t9 = (1446 - t2); form1.t9.value = t9;
    var t10 = (t2 - t1); form1.t10.value = t10;
    var t20 = (t9 * 12 * t3 / 420); form1.t20.value = Math.round(t20);
    var percentage = ((t5 / serviceYears) * 100); if (percentage > 100) percentage = 100;
    var progressBar = document.getElementById("progressBar"), inputField = document.getElementById("t5");
    var currentWidth = 0;
    var interval = setInterval(function() { if (currentWidth >= percentage) { clearInterval(interval); } else { currentWidth++; progressBar.style.width = currentWidth + "%"; } }, 50);
    inputField.value = t5;
    document.getElementById("inputFields").style.display = "none";
    document.getElementById("dhoooy").style.display = "block";
}
function resetForm() {
    form1.t1.placeholder = "ادخل تاريخ ميلادك مثال 1404";
    form1.t2.placeholder = "ادخل تاريخ الالتحاق مثال 1404";
    form1.t3.placeholder = "آخر مربوط راتب أساسي";
    document.getElementById("dhoooy").style.display = "none";
    document.getElementById("inputFields").style.display = "block";
}
</script>
</body>
</html>
